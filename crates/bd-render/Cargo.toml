[package]
name = "bd-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bd-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # D3DCompile: шейдер NV12→RGB компилируется при старте.
    # d3dcompiler_47.dll входит в состав Windows, ставить нечего.
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_UI_WindowsAndMessaging",
    # VK_F9 для горячей клавиши оверлея (§10.4).
    "Win32_UI_Input_KeyboardAndMouse",
    # WNDCLASSEXW несёт HBRUSH фона, поэтому тянет за собой GDI.
    # Рисовать через GDI мы не собираемся — только регистрировать класс.
    "Win32_Graphics_Gdi",
    # Оверлей статистики: текст поверх кадра в том же D3D11 (§6.1).
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_System_LibraryLoader",
] }
