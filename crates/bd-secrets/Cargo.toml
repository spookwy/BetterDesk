[package]
name = "bd-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bd-crypto.workspace = true
thiserror.workspace = true
tracing.workspace = true

# DPAPI живёт в crypt32.dll; LocalFree — в Foundation.
#
# Берём биндинги из того же `windows`, что и остальной проект.
# Готовый крейт `windows-dpapi` (MIT/Apache, 409 строк) притащил бы
# ВТОРОЙ набор Win32-биндингов — `winapi` рядом с `windows` 0.62.
# Две реализации одних и тех же типов в одной сборке — источник
# расхождений на ровном месте, и цена этого выше, чем сто строк
# своей обёртки вокруг двух вызовов.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
