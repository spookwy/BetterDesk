[package]
name = "bd-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
# Проверка наличия libclang — общее условие из
# build-support/nvenc_probe.rs. Без неё флаг nvenc_available разошёлся
# бы с bd-codec, и хост не собрался бы на машине без LLVM (находка 61).
libloading = "0.8"

[dependencies]
bd-core.workspace = true
bd-capture.workspace = true
bd-codec.workspace = true
bd-input.workspace = true
bd-transport.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Нужен выбору энкодера: он передаёт D3D11-текстуру напрямую в NVENC
# и Media Foundation. Больше хост из Win32 ничего не трогает — захват
# и энкод спрятаны за bd-capture и bd-codec (CLAUDE.md §4.2.2).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }
