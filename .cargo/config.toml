# Статическая линковка MSVC runtime.
#
# Без неё готовый .exe требует установленного Visual C++
# Redistributable — то есть ровно ту зависимость, которой у продукта
# быть не должно (§7.1: «скачал и запустил»). На машине без него
# запуск падает с «VCRUNTIME140.dll не найдена»: сообщением, по
# которому человек не может сделать ничего.
#
# Цена — несколько сот килобайт на бинарь. Против «не запускается
# вовсе» это не размен, а очевидный выбор.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
